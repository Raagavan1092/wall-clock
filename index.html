<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vedic Wall Clock</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15120d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vedic Clock">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>html, body { margin: 0; background: #0b0a08; }</style>
</head>
<body>
<script>
  // Boot script. Fetches the clock's HTML, CSS and scripts - listed in
  // app-files.json - revalidating each one with the server on every load
  // (cache: "no-cache"), so a browser can never run a stale file or pair an
  // old script with a new page. Unchanged files come back as a quick 304.
  // This shell itself holds nothing that changes, and is never edited when
  // the app is.
  (function () {
    var SHELL = 1;
    var FRESH = { cache: "no-cache" };

    // An old version registered a service worker / offline cache that could
    // serve stale files; remove any left behind.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
    if (window.caches) {
      caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
    }

    function get(url) {
      return fetch(url, FRESH).then(function (r) {
        if (!r.ok) throw new Error(url + " (HTTP " + r.status + ")");
        return r.text();
      });
    }

    get("app-files.json").then(function (text) {
      var files = JSON.parse(text);
      if (files.shell !== SHELL) {
        // This shell is out of date (only possible if the boot script itself
        // changed): refresh it from the server, once.
        var tried = false;
        try { tried = sessionStorage.getItem("shellRefreshed") === "1"; sessionStorage.setItem("shellRefreshed", "1"); } catch (e) { tried = true; }
        if (!tried) {
          return fetch(location.pathname, { cache: "reload" }).then(function () { location.reload(); });
        }
      }
      return Promise.all([
        Promise.all(files.css.map(get)),
        get(files.html),
        Promise.all(files.js.map(get)),
      ]).then(function (parts) {
        files.css.forEach(function (url, i) {
          var style = document.createElement("style");
          style.textContent = parts[0][i] + "\n/*# sourceURL=" + url + " */";
          document.head.appendChild(style);
        });
        document.body.insertAdjacentHTML("afterbegin", parts[1]);
        // Appended in order; each runs as it is added, like a normal script tag.
        files.js.forEach(function (url, i) {
          var script = document.createElement("script");
          script.textContent = parts[2][i] + "\n//# sourceURL=" + url;
          document.body.appendChild(script);
        });
      });
    }).catch(function (err) {
      document.body.style.cssText = "color:#f0e6c8;font:16px system-ui;padding:24px";
      document.body.textContent = "The clock could not load: " + err.message + ". Check the connection and reload.";
    });
  })();
</script>
</body>
</html>
