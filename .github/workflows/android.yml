name: Android APK

# Builds the Android app (android/) around the web app and publishes the APK:
#  - every run: the APK is a workflow artifact;
#  - pushes to master: also a GitHub Release "android-<run number>" with the APK attached,
#    which is the link to open on the phone.
# The app's UI is loaded from the web, so web changes do NOT trigger a build. It
# only builds when the native code (android/) changes, or when run by hand.
on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner image ships an Android SDK; make sure platform 36 / build-tools 36 are there.
      - name: Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # The signing key is never committed. Preferred: a repository secret ANDROID_KEYSTORE_BASE64
      # (+ ANDROID_KEYSTORE_PASSWORD). Otherwise one is generated once and kept in the Actions cache
      # (private to this repo), so every build is signed alike and installs over the last.
      - name: Restore signing key
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/vedic-signing
          key: vedic-signing-key-v1

      - name: Signing key
        env:
          SECRET_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/vedic-signing
          if [ -n "$SECRET_B64" ]; then
            echo "$SECRET_B64" | base64 -d > ~/vedic-signing/sideload.jks
            echo -n "$SECRET_PW" > ~/vedic-signing/password
            echo "Using the key from repository secrets"
          elif [ ! -f ~/vedic-signing/sideload.jks ]; then
            openssl rand -hex 16 | tr -d '\n' > ~/vedic-signing/password
            keytool -genkeypair -keystore ~/vedic-signing/sideload.jks -storepass "$(cat ~/vedic-signing/password)" \
              -keypass "$(cat ~/vedic-signing/password)" -alias sideload -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=VedicWallClock, O=Sideload"
            echo "Generated a new signing key (first run, or the cached one expired)"
          else
            echo "Using the cached signing key"
          fi
          echo "VEDIC_KEYSTORE=$HOME/vedic-signing/sideload.jks" >> "$GITHUB_ENV"
          echo "VEDIC_KEYSTORE_PASSWORD=$(cat ~/vedic-signing/password)" >> "$GITHUB_ENV"
          echo "::add-mask::$(cat ~/vedic-signing/password)"

      - name: Web tests (alarm engine, smoke test, Android bridge)
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node test/run-web-tests.js

      - name: JVM unit tests (scheduling logic)
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Lint (report only)
        working-directory: android
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/VedicWallClock-${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/VedicWallClock-${{ github.run_number }}-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VedicWallClock-apk
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore

      - name: Release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Vedic Wall Clock (Android) build ${{ github.run_number }}
          body: |
            Install `VedicWallClock-${{ github.run_number }}.apk` on the phone (allow "install unknown apps" for the browser/Files app), then open the app and follow the "Make alarms reliable" checklist. See android/README.md.
          files: dist/VedicWallClock-${{ github.run_number }}.apk
          make_latest: true
