<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vedic Wall Clock — Alarm engine tests</title>
<style>
  body { font-family: ui-monospace, Consolas, monospace; margin: 2rem; background: #111; color: #ddd; }
  h1 { font-size: 1.1rem; }
  .pass { color: #7fd17f; } .fail { color: #e06060; font-weight: bold; }
  #summary { margin: 1rem 0; padding: 1rem; background: #1a1a1a; border: 1px solid #444; }
  li { margin: 2px 0; }
</style>
</head>
<body>
<h1>Vedic Wall Clock — alarm engine tests</h1>
<div id="summary">Running…</div>
<ul id="results"></ul>

<script src="../js/vendor/astronomy.browser.js"></script>
<script src="../js/engine/util.js"></script>
<script src="../js/engine/ayanamsa.js"></script>
<script src="../js/engine/sunrise.js"></script>
<script src="../js/engine/sidereal.js"></script>
<script src="../js/engine/elongation.js"></script>
<script src="../js/engine/tithi.js"></script>
<script src="../js/engine/nakshatra.js"></script>
<script src="../js/engine/yoga.js"></script>
<script src="../js/engine/karana.js"></script>
<script src="../js/engine/lagna.js"></script>
<script src="../js/engine/day-events.js"></script>
<script src="../js/engine/masa.js"></script>
<script src="../js/engine/scaled-intervals.js"></script>
<script src="../js/engine/ghati.js"></script>
<script src="../js/engine/panchanga.js"></script>
<script src="../js/render/ring-adapter.js"></script>
<script src="../js/render/dial.js"></script>
<script src="../js/settings.js"></script>
<script src="../js/tunes.js"></script>
<script src="../js/alarms.js"></script>
<script>
(async function () {
  const E = window.VedicEngine, A = E.Alarms;
  const data = await fetch("../js/data/panchanga-data.json").then(r => r.json());
  const settings = E.Settings.defaults();
  const results = document.getElementById("results");
  let failed = 0, total = 0;
  function check(name, ok, detail) {
    total++;
    if (!ok) failed++;
    const li = document.createElement("li");
    li.className = ok ? "pass" : "fail";
    li.textContent = (ok ? "PASS " : "FAIL ") + name + (detail !== undefined ? "  — " + detail : "");
    results.appendChild(li);
  }
  const MIN = 60000;
  const until = async (fn, ms) => { const t0 = Date.now(); while (Date.now() - t0 < (ms || 8000)) { const v = fn(); if (v) return v; await new Promise(r => setTimeout(r, 20)); } return null; };

  // An isolated store, with ticks driven by hand.
  const KEY = "vedicWallClock.alarms.test";
  localStorage.removeItem(KEY);
  const rings = [];
  A.init({ getSettings: () => settings, getData: () => data, storageKey: KEY, autoTick: false });
  A.onRing(ev => rings.push(ev));

  // --- catalog and the per-day event builder agree -------------------------
  const catalog = E.RingAdapter.buildAlarmCatalog(data);
  const ids = new Set();
  catalog.forEach(g => g.items.forEach(i => ids.add(i.id)));
  check("catalog has unique ids", ids.size === catalog.reduce((n, g) => n + g.items.length, 0), ids.size + " events");
  const seen = new Set(), unknown = new Set();
  let day = new Date(), prevNext = null, maxGap = 0;
  for (let i = 0; i < 40; i++) {
    const snap = E.Panchanga.compute(day, settings);
    if (prevNext != null) maxGap = Math.max(maxGap, Math.abs(snap.anchors.governingSunrise - prevNext));
    prevNext = snap.anchors.nextSunrise.getTime();
    E.RingAdapter.buildAlarmEvents(snap, data).forEach(e => { (ids.has(e.id) ? seen : unknown).add(e.id); });
    day = new Date(snap.anchors.nextSunrise.getTime() + MIN);
  }
  check("every event built is in the catalog", unknown.size === 0, [...unknown].join(","));
  check("every catalog event occurs within 40 days", seen.size === ids.size, "missing: " + [...ids].filter(i => !seen.has(i)).join(","));
  check("consecutive Vedic days join up (< 1s)", maxGap < 1000, maxGap + " ms");

  // --- searching forward: true boundaries -----------------------------------
  const tithi = await A.preview({ events: ["tithi:11"], mode: "start" }, 2);
  check("tithi: found two Ekādaśī (śukla)", tithi.length === 2);
  check("tithi: start and end are true boundaries", tithi.every(x =>
    E.Tithi.current(new Date(x.start + 90000)).number === 11 && E.Tithi.current(new Date(x.start - 90000)).number === 10 &&
    E.Tithi.current(new Date(x.end - 90000)).number === 11 && E.Tithi.current(new Date(x.end + 90000)).number === 12));
  const nak = await A.preview({ events: ["nak:3"], mode: "end" }, 2);
  check("nakṣatra: 'end' alarms fire at the true end", nak.every(x => x.fire === x.end &&
    E.Nakshatra.current(new Date(x.end - 90000), "lahiri").index === 3 && E.Nakshatra.current(new Date(x.end + 90000), "lahiri").index === 4));
  const lagna = await A.preview({ events: ["lagna:0"], mode: "start" }, 5);
  check("lagna: one occurrence per day, no duplicates from the day joins", lagna.length === 5 && lagna.every((x, i) => i === 0 || Math.abs(x.start - lagna[i - 1].start - 86164000) < 15 * MIN));

  // --- offsets ----------------------------------------------------------------
  const start = await A.preview({ events: ["win:rahu"], mode: "start" }, 3);
  const end = await A.preview({ events: ["win:rahu"], mode: "end" }, 3);
  check("start: rings at the start", start.every(x => x.fire === x.start));
  check("end: rings at the end", end.every(x => x.fire === x.end && x.end > x.start));
  for (const [value, unit, want] of [[30, "min", 30], [2, "ghati", 48], [1.5, "hr", 90], [72, "hr", 4320]]) {
    const r = await A.preview({ events: ["win:rahu"], mode: "before", offsetValue: value, offsetUnit: unit }, 2);
    check("before " + value + " " + unit + " = " + want + " min ahead", r.length === 2 && r.every(x => (x.start - x.fire) / MIN === want && x.fire > Date.now()));
  }
  check("'before 0' is just the start", (await A.preview({ events: ["win:rahu"], mode: "before", offsetValue: 0 }, 1))[0].fire === start[0].start);

  // --- several events, instants, rare events, bad input ------------------------------
  const multi = await A.preview({ events: ["sun:rise", "sun:set", "marker:avartana"], mode: "start" }, 6);
  check("several events come out in time order", multi.length === 6 && multi.every((x, i) => i === 0 || multi[i - 1].fire <= x.fire));
  const sk = await A.preview({ events: ["marker:sankranti"], mode: "start" }, 2);
  check("saṅkrānti (about monthly) is found, with its rāśi", sk.length === 2 && /Saṅkrānti/.test(sk[0].detail), sk.map(x => x.detail).join(", "));
  check("no events / unknown id -> nothing", (await A.preview({ events: [] }, 1)).length === 0 && (await A.preview({ events: ["nope"] }, 1)).length === 0);
  const dur = await A.preview({ events: ["win:durmuhurta"], mode: "start" }, 14);
  check("adjacent windows of one kind merge (Saturday's two Durmuhūrta)", dur.some(x => x.end - x.start > 80 * MIN) && dur.every(x => x.end - x.start < 100 * MIN));

  // --- stored alarms: firing, once, grace, persistence --------------------------------
  const a1 = A.add({ events: ["win:rahu"], mode: "before", offsetValue: 10, offsetUnit: "min", repeat: "always", label: "  prep  " });
  const a2 = A.add({ events: ["win:gulika"], mode: "start", repeat: "once" });
  check("add normalises (label trimmed, ids assigned)", a1 && a1.label === "prep" && a1.id && a2.id !== a1.id);
  check("alarm without events is refused", A.add({ events: ["nope"] }) === null);
  const listed = () => A.list();
  await until(() => listed().every(a => a.next));
  const n1 = listed().find(a => a.id === a1.id).next, n2 = listed().find(a => a.id === a2.id).next;
  check("each alarm worked out its next ring", n1 && n2, new Date(n1.fireAt).toISOString() + " / " + new Date(n2.fireAt).toISOString());

  A.tick(n1.fireAt - 5000);
  check("does not ring early", rings.length === 0);
  A.tick(n1.fireAt + 1000);
  check("rings on time, with the event named", rings.length >= 1 && rings.some(r => r.alarm.id === a1.id && r.items[0].label === "Rāhu Kālam"));
  const ringsAfter = rings.length;
  A.tick(n1.fireAt + 2000);
  check("rings once, not every tick", rings.length === ringsAfter);
  const next1 = await until(() => { const a = listed().find(x => x.id === a1.id); return a.next && a.next.fireAt > n1.fireAt && a.next; });
  check("recurring alarm re-arms for the next occurrence", !!next1 && next1.fireAt - n1.fireAt > 12 * 3600 * 1000, next1 && new Date(next1.fireAt).toISOString());

  // An alarm that is long overdue (the page was asleep) is skipped, not shouted.
  // a2's first ring was already far in the past at the tick above.
  check("overdue beyond the grace period is skipped silently", !rings.some(r => r.alarm.id === a2.id));
  // Whether a2's first ring is already past depends on the time of day the test
  // runs at, so push the clock beyond its grace period explicitly.
  A.tick(Math.max(n1.fireAt, n2.fireAt) + A.GRACE_MS + MIN);
  const a2Next = await until(() => { const a = listed().find(x => x.id === a2.id); return a.next && a.next.fireAt > n2.fireAt && a.next; });
  check("a skipped 'once' alarm stays armed for its next occurrence", listed().find(a => a.id === a2.id).enabled && !!a2Next && a2Next.fireAt > n2.fireAt);
  const a5 = A.add({ events: ["win:yamaganda"], mode: "start", repeat: "always" });
  await until(() => listed().find(a => a.id === a5.id).next);
  const n5 = listed().find(a => a.id === a5.id).next;
  const ringsBefore5 = rings.length;
  A.tick(n5.fireAt + A.GRACE_MS + MIN);
  check("6 minutes late is not rung", rings.length === ringsBefore5 && !rings.some(r => r.alarm.id === a5.id));
  const n5b = await until(() => { const a = listed().find(x => x.id === a5.id); return a.next && a.next.fireAt > n5.fireAt && a.next; });
  check("...and the alarm moves on to the next occurrence", !!n5b);
  A.remove(a5.id);

  // once: rings, then switches itself off
  const a3 = A.add({ events: ["win:yamaganda"], mode: "start", repeat: "once" });
  await until(() => listed().find(a => a.id === a3.id).next);
  const n3 = listed().find(a => a.id === a3.id).next;
  A.tick(n3.fireAt + 500);
  check("'once' rings", rings.some(r => r.alarm.id === a3.id));
  check("'once' then turns itself off", listed().find(a => a.id === a3.id).enabled === false);

  // grace: within the grace period still rings
  const a4 = A.add({ events: ["win:gulika"], mode: "end", repeat: "always" });
  await until(() => listed().find(a => a.id === a4.id).next);
  const n4 = listed().find(a => a.id === a4.id).next;
  A.tick(n4.fireAt + 2 * MIN);
  check("2 minutes late still rings (within grace)", rings.some(r => r.alarm.id === a4.id));

  // custom times: an IST clock time, or ghaṭī + pala after sunrise
  const IST = 5.5 * 60 * MIN, now0 = Date.now();
  const ck = await A.preview({ custom: { kind: "clock", hour: 6, minute: 30 }, repeat: "always" }, 3);
  check("custom clock time: 3 daily rings at 06:30 IST", ck.length === 3 && ck.every(x => x.fire > now0 && (x.fire + IST) % (24 * 60 * MIN) === 6.5 * 60 * MIN) && ck[1].fire - ck[0].fire === 24 * 60 * MIN, ck.map(x => new Date(x.fire).toISOString()).join(", "));
  const gh = await A.preview({ custom: { kind: "ghati", ghati: 10, pala: 30 }, repeat: "always" }, 2);
  check("custom ghaṭī·pala: rings 10 ghaṭī 30 pala after sunrise, daily", gh.length === 2 && gh[0].fire > now0 && gh[1].fire - gh[0].fire > 23 * 60 * MIN && gh[1].fire - gh[0].fire < 25 * 60 * MIN, gh.map(x => new Date(x.fire).toISOString()).join(", "));
  const gh0 = await A.preview({ custom: { kind: "ghati", ghati: 0, pala: 0 }, repeat: "always" }, 1);
  const dd = gh[0].fire - gh0[0].fire, want = (10 * 24 + 12) * MIN;
  check("ghaṭī offset is exact (10 ghaṭī 30 pala = 252 min after ghaṭī 0)", gh0.length === 1 && (Math.abs(dd - want) < 4 * MIN || Math.abs(dd - want + 24 * 60 * MIN) < 6 * MIN), String(dd / MIN));
  check("out-of-range custom time is refused", A.add({ custom: { kind: "clock", hour: 24, minute: 0 } }) === null && A.add({ custom: { kind: "ghati", ghati: 60, pala: 0 } }) === null);
  const tom = new Date(Date.now() + IST + 24 * 60 * MIN).toISOString().slice(0, 10);
  const dc = await A.preview({ custom: { kind: "clock", hour: 6, minute: 30, date: tom }, repeat: "always" }, 3);
  check("custom clock time with a date: that one date only", dc.length === 1 && new Date(dc[0].fire + IST).toISOString() === tom + "T06:30:00.000Z", dc.map(x => new Date(x.fire).toISOString()).join(","));
  const dg = await A.preview({ custom: { kind: "ghati", ghati: 10, pala: 30, date: tom }, repeat: "always" }, 3);
  check("custom ghaṭī with a date: one ring, on that day", dg.length === 1 && new Date(dg[0].fire + IST).toISOString().slice(0, 10) === tom, dg.map(x => new Date(x.fire).toISOString()).join(","));
  check("a date in the past never rings", (await A.preview({ custom: { kind: "clock", hour: 6, minute: 30, date: "2020-01-01" } }, 1)).length === 0);
  const ac = A.add({ custom: { kind: "clock", hour: 6, minute: 30 }, repeat: "once", label: "wake" });
  await until(() => listed().find(a => a.id === ac.id).next);
  const nc = listed().find(a => a.id === ac.id);
  check("custom alarm lists with its wording", nc.title === "wake" && nc.triggerText === "At 06:30 IST" && nc.events.length === 0);
  A.tick(nc.next.fireAt + 1000);
  check("custom alarm rings and 'once' switches off", rings.some(r => r.alarm.id === ac.id && r.items[0].label === "06:30 IST") && listed().find(a => a.id === ac.id).enabled === false);
  A.remove(ac.id);

  // persistence + toggles
  const stored = JSON.parse(localStorage.getItem(KEY));
  check("saved to storage", stored.alarms.length === 4 && stored.alarms.every(a => !Object.keys(a).some(k => k.startsWith("_"))));
  A.setEnabled(a1.id, false);
  check("can be switched off", listed().find(a => a.id === a1.id).enabled === false && listed().find(a => a.id === a1.id).next === undefined);
  A.update(a1.id, { events: ["tithi:11", "tithi:26"], mode: "end", repeat: "always" });
  const updated = A.get(a1.id);
  check("edit replaces the alarm and re-enables it", updated.enabled && updated.mode === "end" && updated.events.length === 2);
  A.remove(a1.id);
  check("remove", !A.get(a1.id));
  check("titles summarise events", A.eventsText(["tithi:11", "tithi:26"]) === "Ekādaśī (śukla) · Ekādaśī (kṛṣṇa)" &&
    A.eventsText(catalog.find(g => g.id === "yoga").items.map(i => i.id)) === "All Yoga");
  check("trigger wording differs for instants", A.triggerText({ events: ["sun:set"], mode: "start" }) === "At the moment" && A.triggerText({ events: ["win:rahu"], mode: "start" }) === "At the start");

  // --- sound choice -----------------------------------------
  const sk1 = A.add({ events: ["win:rahu"], mode: "before", offsetValue: 20, offsetUnit: "min", repeat: "always", label: "Rāhu, careful; a very long label so that the line has to be folded across several lines for sure", soundKind: "track" });
  check("sound choice is kept ('track'), anything else is the bell", sk1.soundKind === "track" && A.add({ events: ["win:rahu"], soundKind: "x" }).soundKind === "bell");
  check("a built-in tune is kept by id; an unknown tune falls back to the bell",
    A.add({ events: ["win:rahu"], soundKind: "tune:funk-alarm" }).soundKind === "tune:funk-alarm" && A.add({ events: ["win:rahu"], soundKind: "tune:nope" }).soundKind === "bell");
  check("there are 20 tunes, each with a name, and every one parses", E.Tunes.list.length === 20 && E.Tunes.list.every(t => t.name && t.sub && E.Tunes.get(t.id).voices.every(v => v.notes.trim().split(/\s+/).every(tok => /^(r|-?\d+(\+-?\d+)*):\d*\.?\d+$/.test(tok)))));
  check("every voice fits its loop (notes add up to the tune's length)", E.Tunes.list.every(t => E.Tunes.get(t.id).voices.every(v => Math.abs(v.notes.trim().split(/\s+/).reduce((n, tok) => n + parseFloat(tok.split(":")[1]), 0) - E.Tunes.get(t.id).beats) < 1e-9)));
  check("scale degrees map to the right pitch (C major: 0 = C4, 9 = E5, -7 = C3)", Math.abs(E.Tunes.frequency(E.Tunes.get("reveille-rush"), 0, 0) - 261.63) < 0.1 && Math.abs(E.Tunes.frequency(E.Tunes.get("reveille-rush"), 9, 0) - 659.26) < 0.1 && Math.abs(E.Tunes.frequency(E.Tunes.get("reveille-rush"), -7, 0) - 130.81) < 0.1);
  check("every tune's instruments exist and a pass can be scheduled (offline render, no clipping)", await (async () => {
    for (const info of E.Tunes.list) {
      const tune = E.Tunes.get(info.id), sr = 22050, oc = new OfflineAudioContext(1, Math.ceil((tune.beats * 60 / tune.bpm + 3) * sr), sr);
      const master = oc.createGain(); master.gain.value = 0.9; master.connect(oc.destination); // as the player's master gain
      E.Tunes.schedulePass(oc, master, tune, 0);
      const d = (await oc.startRendering()).getChannelData(0); let peak = 0;
      for (let i = 0; i < d.length; i++) { if (d[i] !== d[i]) return false; peak = Math.max(peak, Math.abs(d[i])); }
      if (peak < 0.05 || peak > 1) return false;
    }
    return true;
  })());

  // --- date shown for times after midnight, before sunrise ------------------------------
  const sunrises = await A.preview({ events: ["sun:rise"], mode: "start" }, 2);
  const sunsets = await A.preview({ events: ["sun:set"], mode: "start" }, 1);
  const sr0 = sunrises[0].start;
  check("dateNote: sunrise itself and daytime/evening have none", A.dateNote(sr0) === "" && A.dateNote(sr0 + 3 * 3600000) === "" && A.dateNote(sunsets[0].start) === "");
  check("dateNote: 2 s before sunrise has the date, e.g. (Nov 3)", /^ \([A-Z][a-z]{2} \d{1,2}\)$/.test(A.dateNote(sr0 - 2000)), A.dateNote(sr0 - 2000));
  check("dateNote: just after midnight IST has the date", A.dateNote(Math.floor((sr0 + 19800000) / 86400000) * 86400000 - 19800000 + 30000) !== "");
  const snapNow = E.Panchanga.compute(new Date(sr0 - 3600000), settings);
  const sameAsDial = [].concat(...["muhurta", "hora"].map(k => E.RingAdapter.build(k, snapNow, data).segments.map(g => [g.startTime, g.endTime])))
    .flat().filter(t => Math.abs(t - snapNow.anchors.nextSunrise) > 5000)
    .every(t => E.RingAdapter.dateNote(t, snapNow.anchors) === A.dateNote(t.getTime()));
  check("dateNote: agrees with the dial's tooltip rule on every segment time", sameAsDial);

  // --- for a host that rings natively: upcoming() and markRang() ------------------------
  A.list().forEach(a => A.remove(a.id));
  const up = A.add({ events: ["sun:rise"], mode: "start", repeat: "always" });
  const upc = await A.upcoming(up.id, 5);
  check("upcoming: 5 sunrises, ascending, in the future, one item each", upc.length === 5 && upc.every((g, i) => g.fireAt > Date.now() && g.items.length === 1 && (i === 0 || g.fireAt > upc[i - 1].fireAt)));
  check("upcoming: items carry label, group and times", upc[0].items[0].label && upc[0].items[0].group && upc[0].items[0].start === upc[0].fireAt);
  const both = A.add({ events: ["sun:rise", "sun:set"], mode: "start", repeat: "always" });
  const bothUp = await A.upcoming(both.id, 6);
  check("upcoming: sunrise and sunset are separate rings (not within a minute)", bothUp.length === 6 && bothUp.every(g => g.items.length === 1));
  const dayAhead = await A.upcoming(up.id, 40);
  check("upcoming: 40 daily rings span about 40 days", dayAhead.length === 40 && Math.abs((dayAhead[39].fireAt - dayAhead[0].fireAt) / 86400000 - 39) < 0.5);
  A.setEnabled(up.id, false);
  check("upcoming: a disabled alarm has none", (await A.upcoming(up.id, 3)).length === 0);
  A.setEnabled(up.id, true);
  const once = A.add({ events: ["sun:rise"], mode: "start", repeat: "once" });
  const first = (await A.upcoming(once.id, 2))[0].fireAt;
  check("markRang: records it, switches a once-alarm off", A.markRang(once.id, first, first + 2000) === true && A.get(once.id).enabled === false && A.get(once.id).lastRang === first + 2000);
  check("markRang: is idempotent", A.markRang(once.id, first, first + 2000) === false);
  const aw = A.get(up.id).armedAfter;
  A.markRang(up.id, upc[0].fireAt, upc[0].fireAt + 1000);
  const upc2 = await A.upcoming(up.id, 2);
  check("markRang: an always-alarm moves on past that ring", A.get(up.id).enabled && A.get(up.id).armedAfter > aw && upc2[0].fireAt > upc[0].fireAt, upc2.map(g => g.fireAt).join());
  check("markRang: unknown alarm is ignored", A.markRang("nope", first, first) === false);

  localStorage.removeItem(KEY);
  const s = document.getElementById("summary");
  s.textContent = failed ? failed + " of " + total + " FAILED" : "All " + total + " checks passed";
  s.className = failed ? "fail" : "pass";
  document.title = (failed ? "FAIL" : "PASS") + " — alarm tests";
})().catch(function (e) { document.getElementById("summary").textContent = "ERROR: " + e.message; document.title = "ERROR"; console.error(e); });
</script>
</body>
</html>
